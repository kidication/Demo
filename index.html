/* ── PROGRESS ── */
#bar{position:fixed;top:0;left:0;right:0;height:6px;background:rgba(0,0,0,.3);z-index:50}
#bar-fill{height:100%;width:4%;background:linear-gradient(90deg,#06d6a0,#ffd166,#e63946);transition:width .5s}

/* ── DOOR BELL ── */
#bell{
  display:none;position:fixed;
  right:13%;top:33%;
  width:36px;height:36px;border-radius:50%;
  background:radial-gradient(circle,#ffd166,#f4a261);
  border:3px solid white;cursor:pointer;z-index:30;
  box-shadow:0 0 0 0 rgba(255,209,102,.8);
  animation:pulse 1.1s infinite;
}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,209,102,.8)}70%{box-shadow:0 0 0 16px rgba(255,209,102,0)}100%{box-shadow:0 0 0 0 rgba(255,209,102,0)}}

/* ── GIFT ── */
#gift{
  display:none;position:fixed;font-size:4em;
  bottom:30%;left:44%;cursor:pointer;z-index:30;
  animation:float 1.8s ease-in-out infinite;
  filter:drop-shadow(3px 4px 10px rgba(0,0,0,.35));
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}

/* ── SPEECH BUBBLES ── */
.bbl{
  display:none;position:fixed;
  background:white;border-radius:14px;padding:10px 14px;
  font-size:.85em;font-weight:700;color:#222;
  max-width:220px;border:2.5px solid #ffd166;
  box-shadow:0 4px 14px rgba(0,0,0,.2);line-height:1.4;z-index:25;
}
.bbl::after{content:'';position:absolute;bottom:-11px;left:18px;border:6px solid transparent;border-top-color:#ffd166}
#bbl-beddy{bottom:36%;left:5%}
#bbl-gooddy{bottom:42%;left:40%}

/* ── DREAM CARDS ── */
#dream-area{
  display:none;position:fixed;
  bottom:210px;left:50%;transform:translateX(-50%);
  gap:26px;z-index:40;
}
.dcard{
  background:rgba(255,255,255,.97);border-radius:22px;padding:22px 32px;
  text-align:center;cursor:pointer;font-family:'Fredoka One',cursive;
  font-size:1.15em;color:#118ab2;border:3px solid #ffd166;
  transition:all .22s;box-shadow:0 8px 28px rgba(0,0,0,.22);min-width:190px;
}
.dcard:hover{transform:scale(1.07);border-color:#06d6a0}
.dcard .ico{font-size:2.8em;margin-bottom:8px}

/* ── STICKY NOTES ── */
.sticky{
  display:none;position:fixed;background:#ffd166;border-radius:5px;
  padding:10px 14px;font-size:.78em;font-weight:700;max-width:185px;
  box-shadow:3px 3px 12px rgba(0,0,0,.2);line-height:1.5;z-index:20;
}
#n1{top:80px;right:16px;transform:rotate(-2deg)}
#n2{top:210px;right:16px;transform:rotate(1.4deg)}

/* ── GOAL LIST ── */
#goal-panel{
  display:none;position:fixed;top:8px;left:50%;transform:translateX(-50%);
  background:rgba(255,255,255,.97);border-radius:20px;padding:18px 22px;
  min-width:400px;max-width:600px;z-index:60;
  border:3px solid #06d6a0;box-shadow:0 8px 32px rgba(0,0,0,.28);
}
#goal-panel h3{font-family:'Fredoka One',cursive;color:#118ab2;margin-bottom:12px;font-size:1.05em;text-align:center}
.gi{
  display:flex;align-items:center;gap:12px;padding:10px 14px;margin:5px 0;
  border-radius:12px;cursor:pointer;border:2px solid #e0e0e0;transition:all .2s;background:white;
}
.gi:hover{border-color:#06d6a0;background:#f0fff8}
.gi.ok{border-color:#06d6a0;background:#d0fff0}
.gi.bad{border-color:#e63946;background:#ffe0e0}
.gicb{width:22px;height:22px;border-radius:6px;border:2px solid #ccc;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1.1em}

/* ── SMART TABLE ── */
#smart-panel{
  display:none;position:fixed;top:8px;left:50%;transform:translateX(-50%);
  background:rgba(255,255,255,.97);border-radius:22px;padding:16px 22px;
  min-width:560px;max-width:720px;z-index:60;
  border:3px solid #ffd166;box-shadow:0 8px 36px rgba(0,0,0,.3);
}
#smart-panel h3{font-family:'Fredoka One',cursive;color:#e63946;font-size:1.2em;margin-bottom:10px;text-align:center}
.sr{display:flex;align-items:flex-start;gap:10px;margin:6px 0;padding:8px;border-radius:10px;background:#f8f9fa}
.sl{font-family:'Fredoka One',cursive;font-size:1.55em;color:#118ab2;width:34px;text-align:center;flex-shrink:0}
.sc{flex:1}
.slbl{font-weight:800;color:#222;font-size:.88em}
.sw{color:#e63946;font-size:.82em}
.sv{color:#06d6a0;font-size:.82em;font-weight:700}
.sp{color:#bbb;font-size:.82em;font-style:italic}

/* ── DIALOG ── */
#dlg{
  position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
  width:88%;max-width:900px;
  background:rgba(255,255,255,.97);border-radius:26px;
  padding:18px 26px 16px;
  box-shadow:0 8px 48px rgba(0,0,0,.38);
  border:3px solid #ffd166;z-index:50;
}
#spkr{font-family:'Fredoka One',cursive;font-size:1.1em;color:#e63946;margin-bottom:4px}
#txt{font-size:1.02em;color:#1a1a2e;line-height:1.65;min-height:44px}
#btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.btn{
  background:linear-gradient(135deg,#06d6a0,#118ab2);
  color:white;border:none;border-radius:50px;padding:10px 22px;
  font-family:'Nunito',sans-serif;font-size:.93em;font-weight:800;
  cursor:pointer;transition:all .18s;box-shadow:0 4px 14px rgba(0,0,0,.2);
}
.btn:hover{transform:translateY(-2px) scale(1.04);filter:brightness(1.1)}
.btn.red{background:linear-gradient(135deg,#e63946,#c1121f)}
.btn.yel{background:linear-gradient(135deg,#ffd166,#f4a261);color:#222}

/* ── SUMMARY ── */
#summary{
  display:none;position:fixed;inset:0;
  background:rgba(10,10,30,.95);z-index:100;
  padding:28px;overflow-y:auto;
}
#summary h2{font-family:'Fredoka One',cursive;color:#ffd166;font-size:2em;text-align:center;margin-bottom:22px}
.scard{
  background:#ffd166;border-radius:14px;padding:16px 22px;
  margin:12px auto;max-width:650px;font-weight:700;color:#222;
  font-size:.97em;line-height:1.65;
}
.scard:nth-child(even){background:#fff3b0;transform:rotate(.5deg)}
.scard:nth-child(odd){transform:rotate(-.4deg)}
.scard h4{font-family:'Fredoka One',cursive;color:#e63946;font-size:1.1em;margin-bottom:7px}
</style>
</head>
<body>

<!-- backgrounds -->
<div id="bg-boy"></div>
<div id="bg-gp"></div>

<!-- progress -->
<div id="bar"><div id="bar-fill"></div></div>

<!-- door bell -->
<div id="bell" onclick="G.openDoor()"></div>

<!-- gift -->
<div id="gift" onclick="G.openGift()">🎁</div>

<!-- bubbles -->
<div class="bbl" id="bbl-beddy"></div>
<div class="bbl" id="bbl-gooddy"></div>

<!-- dream cards -->
<div id="dream-area" style="display:flex">
  <div class="dcard" onclick="G.pickDream(1)"><div class="ico">🚀</div>Полететь на Луну</div>
  <div class="dcard" onclick="G.pickDream(2)"><div class="ico">🏙️</div>Построить город будущего</div>
</div>

<!-- sticky notes -->
<div class="sticky" id="n1"></div>
<div class="sticky" id="n2"></div>

<!-- goal panel -->
<div id="goal-panel"></div>

<!-- smart panel -->
<div id="smart-panel"></div>

<!-- dialog -->
<div id="dlg">
  <div id="spkr"></div>
  <div id="txt"></div>
  <div id="btns"></div>
</div>

<!-- summary -->
<div id="summary"></div>

<script>
// ============================================================
// STATE
// ============================================================
const G = {};
let dream = 0;  // 1=moon, 2=city
let goalSel = {};
let smartStep = 0;
let smartRows = [];

// ============================================================
// HELPERS
// ============================================================
function setBg(who) {
  // who: 'boy' | 'gp'
  document.getElementById('bg-boy').style.opacity = (who === 'boy') ? '1' : '0';
  document.getElementById('bg-gp').style.opacity  = (who === 'gp')  ? '1' : '0';
}

function setProgress(p) {
  document.getElementById('bar-fill').style.width = p + '%';
}

function show(id) { document.getElementById(id).style.display = 'block'; }
function hide(id) { document.getElementById(id).style.display = 'none'; }
function showFlex(id) { document.getElementById(id).style.display = 'flex'; }

function bubble(id, text) {
  const el = document.getElementById('bbl-' + id);
  el.textContent = text;
  el.style.display = 'block';
}
function clearBubbles() {
  ['beddy','gooddy'].forEach(id => {
    document.getElementById('bbl-' + id).style.display = 'none';
  });
}

function note(id, html) {
  const el = document.getElementById(id);
  el.innerHTML = html;
  el.style.display = 'block';
}

// ── DIALOG ──
// buttons: array of {label, cls, cb}
function dlg(speaker, html, buttons) {
  document.getElementById('spkr').textContent = speaker;
  document.getElementById('txt').innerHTML = html;
  const btns = document.getElementById('btns');
  btns.innerHTML = '';
  if (buttons) {
    buttons.forEach(b => {
      const el = document.createElement('button');
      el.className = 'btn ' + (b.cls || '');
      el.textContent = b.label;
      el.onclick = b.cb;
      btns.appendChild(el);
    });
  }
}

// ============================================================
// SCENE 0 – Start (bg: boy)
// ============================================================
function scene0() {
  setBg('boy');
  setProgress(5);
  hide('summary');
  hide('smart-panel');
  hide('goal-panel');
  hide('bell');
  hide('gift');
  hide('dream-area');

  bubble('beddy', 'Не понимаю, зачем тратить время на кубики – всё равно сломается...');

  dlg('Гудди', 'Привет, Эли! Что ты строишь?', [
    { label: 'Продолжить →', cb: scene1 }
  ]);
}

// ============================================================
// SCENE 1 – Dream choice
// ============================================================
function scene1() {
  clearBubbles();
  setProgress(12);
  dlg('Эли', 'У меня есть мечта! Я хочу...', null);
  showFlex('dream-area');
}

G.pickDream = function(d) {
  dream = d;
  hide('dream-area');
  setProgress(20);
  const txt = d === 1
    ? '🚀 Я хочу полететь на Луну и исследовать Космос!'
    : '🏙️ Я хочу построить город будущего!';
  dlg('Эли', txt, [{ label: 'Дальше →', cb: scene2 }]);
};

// ============================================================
// SCENE 2 – Bell appears
// ============================================================
function scene2() {
  setProgress(27);
  show('bell');
  dlg('', '🔔 Кто-то звонит в дверь! Нажми на мигающий кружок, чтобы открыть.', []);
}

// ============================================================
// SCENE 3 – Grandpa enters (bg switches to gp)
// ============================================================
G.openDoor = function() {
  hide('bell');
  setProgress(36);
  setBg('gp');  // ← switch background to grandpa scene

  const msg = dream === 2
    ? 'Добрый день! Смотрю, ты не скучаешь. Какой интересный небоскрёб получается – у тебя определённо есть талант к архитектуре!'
    : 'Добрый день! Смотрю, ты не скучаешь. Какая великолепная ракета получается – похоже, ты любишь Космос!';

  dlg('Дедушка', msg, [{ label: 'Дальше →', cb: scene4 }]);
};

// ============================================================
// SCENE 4 – Gift
// ============================================================
function scene4() {
  setProgress(42);
  show('gift');
  dlg('Дедушка', 'Это тебе подарок! 🎁 Нажми на него, чтобы открыть!', []);
}

G.openGift = function() {
  hide('gift');
  setProgress(48);
  const book = dream === 2
    ? '📚 В подарке книга «Великие здания. Мировая архитектура в разрезе»!'
    : '🌌 В подарке книга «Космос. Энциклопедия»!';
  dlg('', book, [{ label: 'Эли отвечает...', cb: scene5 }]);
};

// ============================================================
// SCENE 5 – Eli reacts
// ============================================================
function scene5() {
  const txt = dream === 2
    ? 'Дедушка, ты настоящий волшебник! Я мечтаю стать архитектором...'
    : 'Дедушка, ты настоящий волшебник! Я мечтаю полететь на Луну и сделать открытия в Космосе!';
  dlg('Эли', txt, [{ label: 'Дальше →', cb: scene6 }]);
}

// ============================================================
// SCENE 6 – What is a goal?
// ============================================================
function scene6() {
  setProgress(52);
  note('n1', 'Цель — это желаемый результат твоих действий, который ты планируешь и стремишься достичь.');
  dlg('Дедушка', 'Мечта – это хорошо! А знаешь, мечту тоже можно построить из кубиков, которые называются <b>цели</b>!', [
    { label: 'А что такое цель?', cb: scene7 },
    { label: 'Расскажи подробнее', cb: scene7 }
  ]);
}

// ============================================================
// SCENE 7 – Explain goal
// ============================================================
function scene7() {
  setProgress(56);
  note('n2', 'Большую цель лучше разбить на промежуточные — так легче прийти к главной цели!');
  dlg('Дедушка',
    '<b>Цель</b> — это желаемый результат, который ты планируешь достичь. Чем конкретнее ты представляешь результат, тем легче его достичь!<br><br>Большую цель можно разбить на промежуточные — так легче прийти к главной мечте!',
    [{ label: 'Понятно! Дальше →', cb: scene8 }]
  );
}

// ============================================================
// SCENE 8 – Choose sub-goals
// ============================================================
function scene8() {
  setProgress(61);
  goalSel = {};

  let title, goals;
  if (dream === 2) {
    title = '🏙️ Чтобы стать архитектором — выбери правильные промежуточные цели:';
    goals = [
      { id:'A1', txt:'🎨 Научиться рисовать',                ok:true },
      { id:'A2', txt:'📐 Выучить геометрию',                 ok:true },
      { id:'A3', txt:'🏊 Стать чемпионом мира по плаванию',  ok:false },
      { id:'A4', txt:'🏛️ Изучать архитектуру известных зданий', ok:true },
    ];
  } else {
    title = '🚀 Чтобы стать космонавтом — выбери правильные промежуточные цели:';
    goals = [
      { id:'B1', txt:'⚛️ Учить физику',          ok:true },
      { id:'B2', txt:'🍦 Съесть много мороженого', ok:false },
      { id:'B3', txt:'🏃 Заниматься спортом',      ok:true },
      { id:'B4', txt:'🌌 Изучать Космос',          ok:true },
      { id:'B5', txt:'🔭 Учить астрономию',        ok:true },
    ];
  }

  // render goal panel
  const panel = document.getElementById('goal-panel');
  let html = '<h3>' + title + '</h3>';
  goals.forEach(g => {
    html += `<div class="gi" id="gi-${g.id}" data-ok="${g.ok}" onclick="toggleGoal('${g.id}')">`
          + `<div class="gicb" id="gcb-${g.id}"></div><span>${g.txt}</span></div>`;
  });
  html += '<div style="margin-top:12px;text-align:center">'
        + '<button class="btn" onclick="confirmGoals()">✅ Подтвердить выбор</button></div>';
  panel.innerHTML = html;
  panel.style.display = 'block';

  dlg('Дедушка', 'Выбери несколько правильных целей на пути к твоей мечте!', []);
}

function toggleGoal(id) {
  const el = document.getElementById('gi-' + id);
  const cb = document.getElementById('gcb-' + id);
  const ok = el.dataset.ok === 'true';

  if (goalSel[id]) {
    delete goalSel[id];
    el.className = 'gi';
    cb.textContent = '';
  } else {
    goalSel[id] = ok;
    el.classList.add(ok ? 'ok' : 'bad');
    cb.textContent = ok ? '✓' : '✗';
  }
}

function confirmGoals() {
  const vals = Object.values(goalSel);
  const hasWrong = vals.some(v => !v);
  const cntOk   = vals.filter(v => v).length;

  if (hasWrong) {
    dlg('Дедушка', '🤔 Подумай ещё раз! Все ли выбранные цели ведут к твоей мечте?', [
      { label: 'Попробую снова', cb: function(){} }
    ]);
    return;
  }
  if (cntOk < 2) {
    dlg('Дедушка', 'Выбери хотя бы 2–3 правильные цели!', [
      { label: 'Хорошо', cb: function(){} }
    ]);
    return;
  }
  hide('goal-panel');
  scene9();
}

// ============================================================
// SCENE 9 – Where to start?
// ============================================================
function scene9() {
  setProgress(67);
  const opt1 = dream === 2 ? '🎨 Научиться рисовать' : '🏃 Заниматься спортом';
  dlg('Дедушка', 'Молодец! Твоя большая цель состоит из маленьких целей. С чего тебе стоит начать?', [
    { label: opt1, cb: scene10 },
    { label: '🤔 Как ты думаешь?', cb: scene10 }
  ]);
}

// ============================================================
// SCENE 10 – SMART intro
// ============================================================
function scene10() {
  setProgress(72);
  dlg('Дедушка', 'Есть специальный способ правильно ставить цели — система <b style="color:#e63946;font-size:1.15em">SMART</b>! 🎯', [
    { label: '🤩 Что это за способ?', cb: scene11 },
    { label: '🔍 Давай проверим!',    cb: scene11 }
  ]);
}

// ============================================================
// SCENE 11 – SMART table interactive
// ============================================================
function scene11() {
  setProgress(76);

  if (dream === 2) {
    smartRows = [
      { L:'S', lbl:'Конкретность – Какой результат?',
        w:'Научиться рисовать',
        v:'Поступить в изо-школу и выиграть приз на выставке',
        q:['Научиться рисовать','Поступить в изо-школу и выиграть приз'] },
      { L:'M', lbl:'Измеримость – Сколько?',
        w:'Много рисовать',
        v:'Рисовать полчаса в день',
        q:['Много рисовать','Рисовать полчаса в день'] },
      { L:'A', lbl:'Достижимость – По силам?',
        w:'Рисовать 5 часов в день',
        v:'Полчаса каждый будний день — это по силам',
        q:['Рисовать 5 часов в день','Полчаса каждый будний день'] },
      { L:'R', lbl:'Важность – Помогает для большой цели?',
        w:'Рисовать просто так',
        v:'Рисование поможет мне стать архитектором',
        q:['Рисовать просто так','Это поможет мне стать архитектором'] },
      { L:'T', lbl:'Сроки – Когда достигну?',
        w:'Когда-нибудь', v:'Через 2 года',
        q:['Когда-нибудь','Через 2 года'] },
    ];
  } else {
    smartRows = [
      { L:'S', lbl:'Конкретность – Какой результат?',
        w:'Заниматься спортом',
        v:'Записаться на плавание и занять призовое место на соревновании',
        q:['Заниматься спортом','Записаться на плавание и занять призовое место'] },
      { L:'M', lbl:'Измеримость – Сколько?',
        w:'Много плавать',
        v:'Плавать 2 раза в неделю по часу',
        q:['Много плавать','Плавать 2 раза в неделю по часу'] },
      { L:'A', lbl:'Достижимость – По силам?',
        w:'Плавать 5 часов в день',
        v:'2 раза в неделю по часу — это по силам',
        q:['Плавать 5 часов в день','2 раза в неделю по часу'] },
      { L:'R', lbl:'Важность – Помогает для большой цели?',
        w:'Плавать когда захочу',
        v:'Спорт необходим, чтобы стать космонавтом',
        q:['Плавать когда захочу','Это поможет мне стать космонавтом'] },
      { L:'T', lbl:'Сроки – Когда достигну?',
        w:'Когда-нибудь', v:'Через 2 года',
        q:['Когда-нибудь','Через 2 года'] },
    ];
  }
  smartStep = 0;
  renderSmart();
}

function renderSmart() {
  const panel = document.getElementById('smart-panel');
  const goalLabel = dream === 2 ? '🎨 Стать архитектором' : '🚀 Стать космонавтом';
  let html = '<h3>Таблица SMART: ' + goalLabel + '</h3>';

  smartRows.forEach((r, i) => {
    html += '<div class="sr"><div class="sl">' + r.L + '</div><div class="sc">'
          + '<div class="slbl">' + r.lbl + '</div>';
    if (i < smartStep)      html += '<div class="sw">❌ ' + r.w + '</div><div class="sv">✅ ' + r.v + '</div>';
    else if (i === smartStep) html += '<div class="sp">← выбери правильный вариант ниже</div>';
    else                    html += '<div class="sp">...</div>';
    html += '</div></div>';
  });
  panel.innerHTML = html;
  panel.style.display = 'block';

  if (smartStep < smartRows.length) {
    const r = smartRows[smartStep];
    dlg('Дедушка', '<b>' + r.L + ' – ' + r.lbl + '</b><br>Какой вариант правильный?', [
      { label: '❌ ' + r.q[0], cls:'red', cb: function() { smartAnswer(false); } },
      { label: '✅ ' + r.q[1], cb:        function() { smartAnswer(true);  } }
    ]);
  } else {
    scene12();
  }
}

function smartAnswer(correct) {
  if (!correct) {
    dlg('Дедушка', '🤔 Подумай ещё раз! Помни: цель должна быть конкретной, измеримой и достижимой.', [
      { label: 'Попробую снова', cb: renderSmart }
    ]);
    return;
  }
  smartStep++;
  renderSmart();
}

// ============================================================
// SCENE 12 – Eli understands SMART
// ============================================================
function scene12() {
  setProgress(86);
  hide('smart-panel');
  const txt = dream === 2
    ? 'Я понял! Моя цель: поступить в изо-школу, рисовать полчаса каждый будний день, а через 2 года выиграть приз на выставке юных художников!'
    : 'Я понял! Моя цель: записаться на плавание, плавать 2 раза в неделю по часу, а через 2 года занять призовое место на соревновании!';
  dlg('Эли', txt, [{ label: '⭐ Дальше →', cb: scene13 }]);
}

// ============================================================
// SCENE 13 – Grandpa says continue
// ============================================================
function scene13() {
  setProgress(89);
  const txt = dream === 2
    ? 'Правильно! А сейчас продолжай строить здание. Ты почти у цели!'
    : 'Правильно! А сейчас продолжай строить ракету. Ты почти у цели!';
  dlg('Дедушка', txt, [{ label: 'Дальше →', cb: scene14 }]);
}

// ============================================================
// SCENE 14 – Tower collapses! (bg back to boy)
// ============================================================
function scene14() {
  setProgress(91);
  setBg('boy');  // ← grandpa is gone, boy alone again
  dlg('Эли', '😱 Остался последний кубик... Я потянулся — и вдруг всё рухнуло!', [
    { label: '😱 Что я наделал!', cb: scene15 },
    { label: '😢 Всё пропало!',   cb: scene15 }
  ]);
}

// ============================================================
// SCENE 15 – Beddy mocks, grandpa back
// ============================================================
function scene15() {
  bubble('beddy', 'Я же говорил — всё равно сломается!');
  setBg('gp');  // grandpa comforts
  dlg('Дедушка', 'Ты так старался! Знаешь, мне вспомнился один рассказ про Эдисона — изобретателя электрической лампочки...', [
    { label: '💡 Расскажи!', cb: scene16 }
  ]);
}

// ============================================================
// SCENE 16 – Edison story
// ============================================================
function scene16() {
  clearBubbles();
  dlg('Дедушка',
    '💡 Когда Эдисона спросили, как он продолжал после ста неудачных опытов, он ответил: '
    + '<i>«У меня было сто удачных опытов, показавших, как лампочка получиться не может! '
    + 'Все мои ошибки сгорели — можно начать всё сначала!»</i>',
    [
      { label: '💪 Я построю заново — ещё лучше!',       cb: scene17 },
      { label: '🌟 Ошибки помогают двигаться вперёд!',   cb: scene17 }
    ]
  );
}

// ============================================================
// SCENE 17 – Back to kids, Gooddy asks
// ============================================================
function scene17() {
  setProgress(95);
  setBg('boy');
  dlg('Гудди', 'Эли, как здорово! Научи и меня ставить правильные цели по системе SMART!', [
    { label: '📋 Перейти к итогам урока!', cb: showSummary }
  ]);
}

// ============================================================
// SUMMARY
// ============================================================
function showSummary() {
  setProgress(100);
  hide('smart-panel');
  hide('goal-panel');
  const el = document.getElementById('summary');
  el.style.display = 'block';
  el.innerHTML = `
    <h2>🌟 Итоги урока: Цели и Мечты</h2>

    <div class="scard">
      <h4>📌 Что такое цель?</h4>
      Цель — это желаемый результат, который ты планируешь и стремишься достичь.
      Чем конкретнее ты представляешь результат, тем легче его достичь!
    </div>

    <div class="scard">
      <h4>🧱 Мечту строим по кубикам</h4>
      Большую цель лучше разбить на маленькие промежуточные цели —
      так легче прийти к главной мечте. Как кубики в башне!
    </div>

    <div class="scard">
      <h4>🎯 Система SMART — 5 пунктов:</h4>
      <b>S</b> — Конкретность: Какой результат ты хочешь получить?<br>
      <b>M</b> — Измеримость: Сколько? Как проверить?<br>
      <b>A</b> — Достижимость: Тебе по силам?<br>
      <b>R</b> — Важность: Помогает достичь большой цели?<br>
      <b>T</b> — Сроки: Когда ты достигнешь цели?
    </div>

    <div class="scard">
      <h4>💡 На ошибках учатся!</h4>
      Неудачный опыт ценен — он показывает, как получиться не может.
      Как Эдисон: <i>«Все мои ошибки сгорели — можно начать всё сначала!»</i>
    </div>

    <div style="text-align:center;margin-top:28px">
      <button class="btn yel" style="font-size:1.1em;padding:14px 36px" onclick="restart()">
        🔄 Пройти ещё раз
      </button>
    </div>
  `;
}

function restart() {
  dream = 0;
  goalSel = {};
  smartStep = 0;
  document.getElementById('n1').style.display = 'none';
  document.getElementById('n2').style.display = 'none';
  clearBubbles();
  scene0();
}

// ============================================================
// START
// ============================================================
scene0();
</script>
